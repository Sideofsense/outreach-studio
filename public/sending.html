<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sending · Outreach Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: 'class' };
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="min-h-screen antialiased">
    <header class="border-b border-white/5 bg-[rgb(11,13,22)]/60 backdrop-blur-xl">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-3">
        <a href="/" class="flex items-center gap-2.5 text-sm font-semibold tracking-tight">
          <span class="relative inline-flex h-6 w-6 items-center justify-center rounded-lg" style="background:linear-gradient(135deg,rgb(255,138,101),rgb(244,96,54));">
            <svg viewBox="0 0 24 24" class="h-3.5 w-3.5 text-white" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
          </span>
          <span>Outreach Studio</span>
        </a>
        <nav class="flex items-center gap-1">
          <a href="/" class="nav-link">Home</a>
          <a href="/companies.html" class="nav-link active">Companies</a>
          <a href="/log.html" class="nav-link">Log</a>
          <a href="/settings.html" class="nav-link">Settings</a>
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-6xl px-6 py-8">
      <p class="text-sm text-[rgb(var(--ink-faint))]">
        <a id="back-link" href="/companies.html" class="hover:text-[rgb(var(--ink-soft))]">← Back to company</a>
      </p>

      <div id="sending-loading" class="mt-6 text-[rgb(var(--ink-muted))]">Loading…</div>
      <div id="sending-error" class="mt-6 hidden rounded-md border border-rose-800 bg-rose-950/40 px-4 py-3 text-rose-200"></div>

      <section id="sending-detail" class="hidden">
        <header class="mt-6 flex flex-wrap items-start justify-between gap-4">
          <div>
            <h1 id="sending-name" class="text-2xl font-semibold tracking-tight"></h1>
            <p class="mt-1 text-sm text-[rgb(var(--ink-faint))]">Live send view · <span id="sending-stream-status" class="text-[rgb(var(--ink-muted))]">connecting…</span></p>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <button id="btn-pause" type="button"
              class="rounded-md border border-slate-700 px-3 py-1.5 text-sm font-medium text-[rgb(var(--ink-soft))] hover:bg-white/[0.04]">Pause</button>
            <button id="btn-resume" type="button"
              class="rounded-md border border-emerald-700 px-3 py-1.5 text-sm font-medium text-[rgb(var(--emerald))] hover:bg-emerald-900/40 hidden">Resume</button>
            <button id="btn-stop-all" type="button"
              class="rounded-md bg-rose-600 px-4 py-1.5 text-sm font-semibold text-white hover:bg-rose-500">STOP ALL</button>
          </div>
        </header>

        <section class="mt-6 grid grid-cols-2 gap-3 sm:grid-cols-5">
          <div class="card p-4">
            <div class="text-xs uppercase tracking-wider text-[rgb(var(--ink-muted))]">Queued</div>
            <div id="kpi-queued" class="mt-1 text-2xl font-semibold text-[rgb(var(--ink))] tabular-nums">0</div>
          </div>
          <div class="card p-4">
            <div class="text-xs uppercase tracking-wider text-[rgb(var(--ink-muted))]">Sending</div>
            <div id="kpi-sending" class="mt-1 text-2xl font-semibold text-[rgb(var(--coral-soft))] tabular-nums">0</div>
          </div>
          <div class="card p-4">
            <div class="text-xs uppercase tracking-wider text-[rgb(var(--ink-muted))]">Sent</div>
            <div id="kpi-sent" class="mt-1 text-2xl font-semibold text-[rgb(var(--emerald))] tabular-nums">0</div>
          </div>
          <div class="card p-4">
            <div class="text-xs uppercase tracking-wider text-[rgb(var(--ink-muted))]">Failed</div>
            <div id="kpi-failed" class="mt-1 text-2xl font-semibold text-[rgb(var(--rose))] tabular-nums">0</div>
          </div>
          <div class="card p-4 col-span-2 sm:col-span-1">
            <div class="text-xs uppercase tracking-wider text-[rgb(var(--ink-muted))]">Next in</div>
            <div id="kpi-next-in" class="mt-1 text-2xl font-semibold text-[rgb(var(--amber))] tabular-nums">—</div>
          </div>
        </section>

        <section class="mt-6 card">
          <h2 class="border-b border-white/5 px-4 py-3 text-sm font-semibold uppercase tracking-wider text-[rgb(var(--ink-muted))]">Live log</h2>
          <ol id="sending-log" class="max-h-[60vh] divide-y divide-slate-800 overflow-y-auto font-mono text-xs">
            <li class="px-4 py-3 text-[rgb(var(--ink-faint))]">Waiting for events…</li>
          </ol>
        </section>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
